[package]
authors = ["dignifiedquire <dignifiedquire@gmail.com>", "Parity Technologies <admin@parity.io>"]
description = "Implementation of the multiaddr format"
edition = "2021"
rust-version = "1.59.0"
repository = "https://github.com/multiformats/rust-multiaddr"
keywords = ["multiaddr", "ipfs"]
license = "MIT"
name = "multiaddr"
readme = "README.md"
version = "0.18.1"
resolver = "2"

[features]
default = ["url", "std"]
std = ["byteorder/std", "multibase/std", "multihash/std", "percent-encoding/std", "serde/std", "bytes/std"]

[dependencies]
arrayref = "0.3.3"
byteorder = { version = "1.3.1", default-features = false }
data-encoding = "2.1"
multibase = { git = "https://github.com/umgefahren/rust-multibase.git", branch = "no-std", default-features = false }
multihash = { git = "https://github.com/umgefahren/rust-multihash.git", default-features = false }
percent-encoding = { version = "2.1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.70", default-features = false }
static_assertions = "1.1"
unsigned-varint = { version = "0.8", default-features = false }
url = { version = "2.1.0", optional = true, default-features = false }
libp2p-identity = { git = "https://github.com/umgefahren/rust-libp2p.git", branch = "no-std", features = ["peerid"], default-features = false }
bytes = { version = "1.7.1", default-features = false }

[dev-dependencies]
bincode = "1"
quickcheck = { version = "1.0.3", default-features = false }
rand = "0.8.4"
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }

